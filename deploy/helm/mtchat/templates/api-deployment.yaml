{{- /*
WebSocket events and online status are shared between API replicas through
Redis; without it every replica sees only its own connections.
*/ -}}
{{- $maxReplicas := ternary .Values.api.autoscaling.maxReplicas .Values.api.replicaCount .Values.api.autoscaling.enabled }}
{{- $multipleReplicas := gt (int $maxReplicas) 1 }}
{{- $redisUrlInEnv := false }}
{{- range .Values.api.extraEnv }}
{{- if eq .name "REDIS_URL" }}{{ $redisUrlInEnv = true }}{{ end }}
{{- end }}
{{- $hasRedis := or .Values.redis.enabled .Values.redis.external.host .Values.secret.REDIS_URL .Values.existingSecret $redisUrlInEnv }}
{{- if and $multipleReplicas (not $hasRedis) }}
{{- fail "More than one API replica requires Redis: set redis.enabled=true, redis.external.host or secret.REDIS_URL, or run a single replica (api.replicaCount=1, api.autoscaling.maxReplicas=1)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mtchat.fullname" . }}-api
  labels:
    {{- include "mtchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mtchat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mtchat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- with .Values.api.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mtchat.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "mtchat.fullname" . }}
            {{- if .Values.postgresql.enabled }}
            - secretRef:
                name: {{ include "mtchat.fullname" . }}-postgresql
                optional: true
            {{- else if .Values.postgresql.external.existingSecret }}
            - secretRef:
                name: {{ .Values.postgresql.external.existingSecret }}
                optional: true
            {{- end }}
            {{- if or .Values.minio.enabled .Values.minio.existingSecret }}
            - secretRef:
                name: {{ if .Values.minio.existingSecret }}{{ .Values.minio.existingSecret }}{{ else }}{{ include "mtchat.fullname" . }}-minio{{ end }}
                optional: true
            {{- end }}
            - secretRef:
                name: {{ include "mtchat.secretName" . }}
                optional: true
          env:
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
